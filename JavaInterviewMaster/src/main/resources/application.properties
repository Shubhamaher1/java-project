# ============================================================
# APPLICATION CONFIGURATION - Spring Boot application.properties
# ============================================================
# Spring Boot auto-reads this file on startup
# Key interview concept: Externalized Configuration
# Priority order: CLI args > System env > application.properties

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name (used in Actuator, Eureka, etc.)
spring.application.name=java-interview-master

# ============================================================
# H2 IN-MEMORY DATABASE (for demo purposes)
# Interview Q: What is H2? Embedded Java SQL database, no install needed
# ============================================================
spring.datasource.url=jdbc:h2:mem:interviewdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (for dev/testing - NEVER enable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ============================================================
# JPA / HIBERNATE CONFIGURATION
# Interview Q: What is JPA? Java Persistence API - ORM specification
# Interview Q: What is Hibernate? JPA implementation (ORM framework)
# ============================================================
# DDL Auto: create-drop (recreate each run), create, update, validate, none
spring.jpa.hibernate.ddl-auto=create-drop
# Show generated SQL in console (disable in production - performance hit)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Lazy loading requires open session - this opens session for entire request
spring.jpa.open-in-view=false

# ============================================================
# LOGGING CONFIGURATION
# Interview Q: Log levels: TRACE > DEBUG > INFO > WARN > ERROR > FATAL > OFF
# ============================================================
logging.level.root=INFO
logging.level.com.interview.master=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ============================================================
# SPRING SECURITY - Default credentials (override in production!)
# Interview Q: Spring Security default behavior - basic auth, form login
# ============================================================
spring.security.user.name=admin
spring.security.user.password=admin123

# ============================================================
# ACTUATOR - Production-ready features
# Interview Q: What is Spring Boot Actuator?
# Provides built-in endpoints: /health, /info, /metrics, /env, /beans
# ============================================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true

# App Info (shown in /actuator/info)
info.app.name=Java Interview Master
info.app.description=Complete Java Interview Preparation
info.app.version=1.0.0

# ============================================================
# JACKSON (JSON Serialization/Deserialization)
# Interview Q: What is Jackson? Java JSON library used by Spring MVC
# ============================================================
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ============================================================
# CACHING
# Interview Q: Spring Cache - @Cacheable, @CachePut, @CacheEvict
# ============================================================
spring.cache.type=simple

# ============================================================
# MULTIPART FILE UPLOAD
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
